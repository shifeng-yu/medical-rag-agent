# ============================================================
# Docker Compose 编排
# 来源：Q1「RAGFlow Docker化私有化部署」+ Q20「Milvus单机版」
# ============================================================

services:
  # ---- Milvus 向量数据库 (Q20: 单机版) ----
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    network_mode: host

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    network_mode: host

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.3
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: localhost:2379
      MINIO_ADDRESS: localhost:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    # host 网络下端口直接占主机，无需（也不支持）ports 映射；见 ADR-0005 决策 7
    depends_on:
      - etcd
      - minio
    network_mode: host

  # ---- MySQL：会话历史 / 用户反馈 / 任务状态（真源，永久留存供复盘） ----
  mysql:
    container_name: medical-rag-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medical_rag}
      MYSQL_USER: ${MYSQL_USER:-medrag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-medrag_dev2026}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-changeme_2026}"]
      interval: 10s
      timeout: 5s
      retries: 12
    network_mode: host

  # ---- Redis：会话热缓存（24h TTL）+ Celery broker ----
  redis:
    container_name: medical-rag-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    network_mode: host

  # ---- 可选：PostgreSQL + pgvector（VECTOR_BACKEND=pgvector 时启用） ----
  # 默认不启动（profile），避免与 Milvus 抢资源：
  #   docker compose --profile pgvector up -d
  #   并在 .env 里设 VECTOR_BACKEND=pgvector
  postgres:
    container_name: medical-rag-postgres
    image: pgvector/pgvector:pg16
    profiles: ["pgvector"]
    environment:
      POSTGRES_DB: ${PG_DATABASE:-medical_rag}
      POSTGRES_USER: ${PG_USER:-medrag}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-medrag_dev2026}
    volumes:
      - ./volumes/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PG_USER:-medrag}"]
      interval: 10s
      timeout: 5s
      retries: 12
    network_mode: host

  # ---- RAG 服务（容器化生产运行；网页上传/问答入口 :8000） ----
  # host 网络：etcd(2379)/minio(9000/9001)/milvus(19530/9091)/api(8000)/baseline(8001)
  # 全部直接监听主机端口，容器间经 localhost 互通（ADR-0005 决策 7/8）。
  medical-rag-api:
    build: .
    container_name: medical-rag-api
    environment:
      - MILVUS_HOST=localhost          # host 网络下连本机 milvus-standalone
      - MILVUS_PORT=19530
      - USE_MILVUS_LITE=0              # 容器内走 pymilvus → Docker Milvus，禁用嵌入式 Lite
      - VECTOR_BACKEND=${VECTOR_BACKEND:-milvus}   # milvus / pgvector（切 pgvector 见下方 postgres 服务）
      - PG_DSN=postgresql://${PG_USER:-medrag}:${PG_PASSWORD:-medrag_dev2026}@127.0.0.1:5432/${PG_DATABASE:-medical_rag}
      - QWEN_MODEL_PATH=/models/Qwen-14B-Chat-GPTQ-Int4
      - USE_GPTQ=1                 # 生产部署启用 GPTQ INT4（8G 显存路径）；标准加载改 0（≥16G 显存或 CPU）
      - BGE_MODEL_PATH=/models/bge-m3
      # 会话/反馈/任务：MySQL 真源；Redis 做热缓存与 Celery broker
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-medrag}:${MYSQL_PASSWORD:-medrag_dev2026}@127.0.0.1:3306/${MYSQL_DATABASE:-medical_rag}?charset=utf8mb4
      - REDIS_URL=redis://127.0.0.1:6379/0
      - TASK_MODE=celery
    volumes:
      - ./models:/models:ro          # 模型权重 (只读) — 必须预先放置，见 docs/DEPLOYMENT.md
      - ./data:/app/data             # 知识库数据 rw：网页上传落盘 data/medical_kb/<department>/
      - ./logs:/app/logs
      - ./prompts:/app/prompts:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
    depends_on:
      milvus:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    network_mode: host

  # ---- 灌库/重建 worker（Celery；与 API 共用镜像与数据卷） ----
  # 嵌入跑 CPU：单卡 12G 上 API 已占 Qwen(~8G)+BGE(~2G)，worker 再抢显存会 OOM。
  # 若有多卡或大显存，把 DEVICE 改回 cuda 并给 worker 单独分配 GPU。
  medical-rag-worker:
    build: .
    container_name: medical-rag-worker
    environment:
      - MILVUS_HOST=localhost
      - MILVUS_PORT=19530
      - USE_MILVUS_LITE=0
      - VECTOR_BACKEND=${VECTOR_BACKEND:-milvus}
      - PG_DSN=postgresql://${PG_USER:-medrag}:${PG_PASSWORD:-medrag_dev2026}@127.0.0.1:5432/${PG_DATABASE:-medical_rag}
      - DEVICE=cpu
      - BGE_MODEL_PATH=/models/bge-m3
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-medrag}:${MYSQL_PASSWORD:-medrag_dev2026}@127.0.0.1:3306/${MYSQL_DATABASE:-medical_rag}?charset=utf8mb4
      - REDIS_URL=redis://127.0.0.1:6379/0
      - TASK_MODE=celery
    volumes:
      - ./models:/models:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./prompts:/app/prompts:ro
    command: >
      celery -A src.tasks.celery_app.celery_app worker
      -l info --concurrency=1 -Q celery
    depends_on:
      milvus:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    network_mode: host

  # ---- Baseline RAG 服务 (Q15: 对照实验, :8001) ----
  baseline-rag:
    build: .
    container_name: baseline-rag
    environment:
      - MILVUS_HOST=localhost
      - MILVUS_PORT=19530
      - BGE_MODEL_PATH=/models/bge-m3
    volumes:
      - ./models:/models:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      python scripts/run_baseline.py
    depends_on:
      milvus:
        condition: service_healthy
    network_mode: host

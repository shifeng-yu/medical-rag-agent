$kind: http-request
name: 重建整库
order: 17000
method: POST
url: '{{base_url}}/api/v1/documents/rebuild?collection=local_kb'
description: '遍历集合目录逐文件重切重嵌，耗时较长；失败文件数在任务结果里如实上报。'
queryParams:
  - key: collection
    value: local_kb
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("状态码 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("返回重建任务", function () {
        var json = pm.response.json();
        pm.expect(json.kind).to.eql("rebuild_collection");
        pm.expect(json.files).to.be.a("number");
        pm.environment.set("task_id", json.task_id);
      });

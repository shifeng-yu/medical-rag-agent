name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies (lightweight, no GPU)
        run: |
          pip install --upgrade pip
          pip install "httpx<0.28"
          pip install pytest
          pip install fastapi==0.110.0
          pip install "uvicorn[standard]==0.29.0"
          pip install pydantic==2.7.0 pydantic-settings==2.2.0
          pip install loguru==0.7.2 python-dotenv==1.0.1
          pip install pymilvus==2.4.3 milvus-lite
          pip install python-multipart==0.0.9
          pip install tiktoken==0.7.0 numpy==1.26.4

      - name: Run tests
        env:
          FORCE_CPU: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set +e
          pytest tests/ -v --tb=long 2>&1 | tee /tmp/pytest.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "::error::===== 测试失败，最后 60 行日志 ====="
            tail -60 /tmp/pytest.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::===== 诊断环境 ====="
            python -c "import sys; print('Python:', sys.version)" 2>&1 | while IFS= read -r line; do echo "::error::$line"; done
            python -c "import milvus_lite; print('milvus_lite OK')" 2>&1 | while IFS= read -r line; do echo "::error::$line"; done
            python -c "from pymilvus import Collection; print('pymilvus OK')" 2>&1 | while IFS= read -r line; do echo "::error::$line"; done
            python -c "import pydantic; print('pydantic:', pydantic.__version__)" 2>&1 | while IFS= read -r line; do echo "::error::$line"; done
            exit $STATUS
          fi

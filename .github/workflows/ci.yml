name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies (lightweight, no GPU)
        run: |
          pip install --upgrade pip
          pip install pytest "httpx<0.28"
          pip install fastapi==0.110.0 "uvicorn[standard]==0.29.0" pydantic==2.7.0 pydantic-settings==2.2.0
          pip install loguru==0.7.2 python-dotenv==1.0.1 pymilvus==2.4.3 python-multipart==0.0.9
          pip install tiktoken==0.7.0 numpy==1.26.4

      - name: Run tests
        env:
          FORCE_CPU: "1"
        run: |
          pytest tests/ -v

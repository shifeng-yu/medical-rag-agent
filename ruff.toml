# ============================================================
# 静态检查配置
#
# 只开 F（pyflakes 规则集：未定义名 / 未使用导入与变量 / f-string 无占位符）
# 与 E9（语法错误）。刻意不开 E/W/I 等风格规则：这个仓库不强制格式化，
# 开了只会制造大面积无关 diff。
#
# 本地跑：pip install ruff && ruff check .
# CI：.github/workflows/ci.yml 的 "Lint (ruff)" 步骤
# ============================================================

target-version = "py310"
line-length = 100

[lint]
select = ["F", "E9"]

exclude = [
  ".venv",
  "venv",
  "frontend",      # JS/TS 工程，由 vite/vitest 管
  "data",
  "volumes",
  "milvus_lite",
  "logs",
  ".postman",
  "postman",
]
